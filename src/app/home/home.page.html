<ion-header>
  <ion-toolbar>
    <ion-title>
      Mapa
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div>
    <ion-button expand="block" (click)="addCurrentLocation()">Agregar mi ubicación</ion-button>
    <ion-button expand="block" (click)="renderRoute()">Obtener ruta</ion-button>
    <ion-button expand="block" (click)="reset()">Reiniciar puntos</ion-button>
  </div>

  <h2>Puntos agregados: {{ getCount() }}</h2>

  <div class="map" id="map">  </div>
</ion-content>
